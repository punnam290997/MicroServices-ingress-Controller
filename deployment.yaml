apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployment-app
  namespace: default
  labels:
    app: ingress-app

spec:
  replicas: 3
  selector:
    matchLabels:
      app: ingress-app

  template:
    metadata:
      labels:
        app: ingress-app

    spec:
      containers:
      - name: deployment-ingress-container
        image: punnam2909/image:latest
        ports:
        - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: deployment-service
  namespace: default

spec:
  type: ClusterIP
  selector:
    app: ingress-app

  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
