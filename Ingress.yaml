apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: techsolutions-ingress
  namespace: default
  annotations:
    kubernetes.io/ingress.class: "nginx"

spec:
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: techsolutions-service
            port:
              number: 80
